version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-backend
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      - PORT=${PORT:-8000}
      - SPOTIFY_MODE=${SPOTIFY_MODE:-test}
      - MUSIC_SERVICE=spotify
      - SESSION_STORAGE=json_file
      - SESSION_STORAGE_FILE=/app/data/disco_incognito.json
      - DEBUG=true

  frontend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-frontend
    network_mode: host
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_PORT=${VITE_PORT:-3000}
      - VITE_UI_MODE=minimal
      - VITE_TEST_MODE=true
      - VITE_WS_DEBUG=true
