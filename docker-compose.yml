version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPOTIFY_MODE=live
      - SESSION_STORAGE=json_file
      - SESSION_STORAGE_FILE=/app/data/disco_incognito.json
    ports:
      - "8080:8080"
    volumes:
      - ./data/disco_incognito.json:/app/data/disco_incognito.json
