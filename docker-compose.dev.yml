version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-backend
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-frontend
    network_mode: host
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
