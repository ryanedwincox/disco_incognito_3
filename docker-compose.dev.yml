version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-backend
    network_mode: host
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - SPOTIFY_MODE=live
      - MUSIC_SERVICE=spotify
      - SESSION_STORAGE=json_file
      - SESSION_STORAGE_FILE=/app/data/disco_incognito.json
      - DEBUG=true

  frontend:
    build:
      context: .
      dockerfile: dev.Dockerfile
      target: dev-frontend
    network_mode: host
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:7999
      - VITE_UI_MODE=minimal
      - VITE_TEST_MODE=false
