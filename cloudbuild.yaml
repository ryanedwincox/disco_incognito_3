options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/disco-incognito", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/disco-incognito"]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "disco-incognito"
      - "--image"
      - "gcr.io/$PROJECT_ID/disco-incognito"
      - "--platform"
      - "managed"
      - "--region"
      - "us-central1"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--concurrency"
      - "80"
      - "--max-instances"
      - "1"
      - "--timeout"
      - "3600"
      - "--add-volume=name=data-vol,type=cloud-storage,bucket=$_BUCKET_NAME"
      - "--add-volume-mount=volume=data-vol,mount-path=/app/data"
      - "--set-secrets=SPOTIFY_CLIENT_ID=spotify-client-id:latest,SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,JWT_SECRET_KEY=jwt-secret-key:latest,SESSION_SECRET=session-secret:latest"
      - "--set-env-vars=SPOTIFY_MODE=live,DEBUG=false,SESSION_STORAGE=json_file,SESSION_STORAGE_FILE=/app/data/disco_incognito.json,ALLOWED_ORIGINS=https://www.discoincognito.com,BACKEND_URL=https://www.discoincognito.com,FRONTEND_URL=https://www.discoincognito.com,SPOTIFY_REDIRECT_URI=https://www.discoincognito.com/api/auth/callback"
